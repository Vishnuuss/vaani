# Vaani Voice Agent — Docker Compose
# Run from the repo root: docker compose up --build -d
version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: vaani/gateway/Dockerfile
    container_name: vaani-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env.production
    environment:
      - VAANI_PUBLIC_WS_URL=${VAANI_PUBLIC_WS_URL:-wss://vaani.bswealthfinance.com/ws}
      - VAANI_BRIEF=clients/bswealth.yaml
      - VAANI_LOG_LEVEL=INFO
      - VAANI_CALL_LOGS=/app/calls
    volumes:
      - call-logs:/app/calls
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AI Voice Agent & Vapi/Dograh Calling Dashboard
  dashboard:
    build:
      context: ./AI-Voice-Agent-Dashboard
      dockerfile: Dockerfile
    container_name: vaani-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      gateway:
        condition: service_healthy

  # Nginx reverse proxy — routes /ws, /answer, /api to gateway and / to dashboard
  nginx:
    image: nginx:alpine
    container_name: vaani-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  call-logs:

