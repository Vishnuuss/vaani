# Nginx config for Vaani gateway
# Proxies HTTP + WebSocket traffic to the gateway container on port 8090

upstream vaani_gateway {
    server gateway:8090;
}

upstream vaani_dashboard {
    server dashboard:3000;
}

server {
    listen 80;
    listen 8080;
    server_name _;

    # Health check
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gateway Health check
    location /health {
        proxy_pass http://vaani_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vobiz telephony answer webhook
    location /answer {
        proxy_pass http://vaani_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint — Vobiz sends call audio here
    location /ws {
        proxy_pass http://vaani_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice calls can be long — never timeout a live call
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # AI Voice Agent Dashboard (Next.js Web UI)
    location / {
        proxy_pass http://vaani_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

